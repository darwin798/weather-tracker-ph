<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Weather Tracker - Philippines</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --card-bg: rgba(255, 255, 255, 0.12);
    --card-border: rgba(255, 255, 255, 0.18);
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.75);
    --text-muted: rgba(255, 255, 255, 0.55);
    --accent: #ffd166;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-gradient);
    min-height: 100vh;
    color: var(--text-primary);
    padding: 20px;
    transition: background 1s ease;
    overflow-x: hidden;
  }

  body.weather-clear { background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%); }
  body.weather-cloudy { background: linear-gradient(135deg, #606c88 0%, #3f4c6b 100%); }
  body.weather-rain { background: linear-gradient(135deg, #3a6073 0%, #16222a 100%); }
  body.weather-snow { background: linear-gradient(135deg, #83a4d4 0%, #b6fbff 100%); }
  body.weather-thunder { background: linear-gradient(135deg, #232526 0%, #414345 100%); }
  body.weather-fog { background: linear-gradient(135deg, #757f9a 0%, #d7dde8 100%); }
  body.weather-night { background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); }

  .container {
    max-width: 1100px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    flex-wrap: wrap;
    gap: 15px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 700;
  }

  .logo svg { width: 32px; height: 32px; }

  .ph-flag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.15);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    backdrop-filter: blur(10px);
  }

  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .search-box {
    position: relative;
    display: flex;
    align-items: center;
  }

  .search-input {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 30px;
    padding: 12px 45px 12px 45px;
    color: white;
    font-size: 14px;
    width: 260px;
    outline: none;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
  }

  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus {
    border-color: rgba(255,255,255,0.5);
    width: 300px;
  }

  .search-icon {
    position: absolute;
    left: 15px;
    color: var(--text-secondary);
    pointer-events: none;
  }

  .search-icon, .icon-btn { width: 20px; height: 20px; }

  .icon-btn {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: white;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
  }

  .icon-btn:hover {
    background: rgba(255,255,255,0.25);
    transform: translateY(-2px);
  }

  .unit-toggle {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 30px;
    padding: 8px;
    display: flex;
    gap: 4px;
    backdrop-filter: blur(10px);
  }

  .unit-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    transition: all 0.3s ease;
  }

  .unit-btn.active {
    background: rgba(255,255,255,0.25);
    color: white;
  }

  /* Quick cities */
  .quick-cities {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    overflow-x: auto;
    padding-bottom: 5px;
    scrollbar-width: thin;
  }

  .quick-cities::-webkit-scrollbar { height: 4px; }
  .quick-cities::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 2px; }

  .city-chip {
    flex-shrink: 0;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 30px;
    padding: 8px 16px;
    color: white;
    font-size: 13px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .city-chip:hover {
    background: rgba(255,255,255,0.25);
    transform: translateY(-2px);
  }

  .city-chip.active {
    background: rgba(255,255,255,0.3);
    border-color: rgba(255,255,255,0.5);
    font-weight: 600;
  }

  .city-chip .temp {
    font-weight: 600;
    color: var(--accent);
  }

  /* Main weather card */
  .main-weather {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 35px;
    backdrop-filter: blur(20px);
    margin-bottom: 25px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 30px;
    align-items: center;
    position: relative;
    overflow: hidden;
    animation: fadeInUp 0.6s ease;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .location-info {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 10px;
  }

  .location-info svg { width: 16px; height: 16px; }

  .city-name {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 5px;
  }

  .date-time {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 25px;
  }

  .temp-row {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 15px;
  }

  .temperature {
    font-size: 88px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: -3px;
  }

  .temp-unit {
    font-size: 32px;
    font-weight: 300;
    margin-top: 10px;
    color: var(--text-secondary);
  }

  .weather-desc {
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 8px;
    text-transform: capitalize;
  }

  .feels-like {
    color: var(--text-secondary);
    font-size: 14px;
  }

  .weather-icon-large {
    width: 200px;
    height: 200px;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  /* Details grid */
  .details-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
  }

  .detail-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px;
    backdrop-filter: blur(10px);
    transition: transform 0.3s ease;
    animation: fadeInUp 0.6s ease backwards;
  }

  .detail-card:nth-child(1) { animation-delay: 0.1s; }
  .detail-card:nth-child(2) { animation-delay: 0.15s; }
  .detail-card:nth-child(3) { animation-delay: 0.2s; }
  .detail-card:nth-child(4) { animation-delay: 0.25s; }
  .detail-card:nth-child(5) { animation-delay: 0.3s; }
  .detail-card:nth-child(6) { animation-delay: 0.35s; }

  .detail-card:hover { transform: translateY(-4px); }

  .detail-label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    font-size: 12px;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .detail-label svg { width: 14px; height: 14px; }

  .detail-value {
    font-size: 22px;
    font-weight: 600;
  }

  .detail-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  /* PAGASA Alert */
  .alert-banner {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.9), rgba(185, 28, 28, 0.9));
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 15px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    backdrop-filter: blur(10px);
    animation: fadeInUp 0.6s ease;
  }

  .alert-banner.info {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.9), rgba(29, 78, 216, 0.9));
  }

  .alert-banner.warning {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.9), rgba(180, 83, 9, 0.9));
  }

  .alert-icon {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
  }

  .alert-content {
    flex: 1;
  }

  .alert-title {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 2px;
  }

  .alert-text {
    font-size: 12px;
    opacity: 0.9;
  }

  /* Forecast sections */
  .forecast-section {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(10px);
    margin-bottom: 25px;
    animation: fadeInUp 0.6s ease backwards;
    animation-delay: 0.4s;
  }

  .section-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title svg { width: 18px; height: 18px; }

  .hourly-scroll {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: thin;
  }

  .hourly-scroll::-webkit-scrollbar { height: 6px; }
  .hourly-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 3px; }
  .hourly-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }

  .hour-card {
    flex-shrink: 0;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 14px 18px;
    text-align: center;
    min-width: 85px;
    transition: all 0.3s ease;
  }

  .hour-card:hover {
    background: rgba(255,255,255,0.18);
    transform: translateY(-3px);
  }

  .hour-card.now {
    background: rgba(255,255,255,0.25);
    border-color: rgba(255,255,255,0.4);
  }

  .hour-time {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    font-weight: 500;
  }

  .hour-icon { width: 32px; height: 32px; margin: 0 auto 8px; }

  .hour-temp {
    font-size: 16px;
    font-weight: 600;
  }

  .hour-precip {
    font-size: 11px;
    color: #7dd3fc;
    margin-top: 4px;
  }

  /* Daily forecast */
  .daily-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .day-row {
    display: grid;
    grid-template-columns: 1.2fr auto 1fr auto;
    gap: 15px;
    align-items: center;
    padding: 12px 15px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    transition: background 0.3s ease;
  }

  .day-row:hover { background: rgba(255,255,255,0.12); }

  .day-name {
    font-weight: 500;
    font-size: 14px;
  }

  .day-name small {
    color: var(--text-muted);
    font-weight: 400;
    margin-left: 6px;
    font-size: 12px;
  }

  .day-icon { width: 32px; height: 32px; }

  .day-desc {
    font-size: 13px;
    color: var(--text-secondary);
    text-align: center;
  }

  .day-temps {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    font-size: 14px;
  }

  .temp-max { font-weight: 600; }
  .temp-min { color: var(--text-muted); }

  /* Loading & Error */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(5px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  .loading-overlay.show { display: flex; }

  .spinner {
    width: 60px;
    height: 60px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(239, 68, 68, 0.95);
    color: white;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14px;
    transition: transform 0.4s ease;
    z-index: 2000;
    backdrop-filter: blur(10px);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  .suggestions {
    position: absolute;
    top: 52px;
    left: 0;
    right: 0;
    background: rgba(30, 30, 50, 0.95);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    backdrop-filter: blur(20px);
    max-height: 280px;
    overflow-y: auto;
    z-index: 100;
    display: none;
  }

  .suggestions.show { display: block; }

  .suggestion-item {
    padding: 12px 18px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    transition: background 0.2s ease;
    font-size: 14px;
  }

  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover { background: rgba(255,255,255,0.1); }

  .suggestion-city { font-weight: 500; }
  .suggestion-country { color: var(--text-muted); font-size: 12px; margin-left: 6px; }

  .live-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #22c55e;
    border-radius: 50%;
    margin-right: 6px;
    animation: livePulse 2s ease-in-out infinite;
  }

  @keyframes livePulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    50% { opacity: 0.6; box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
  }

  .last-updated {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 20px;
    padding-bottom: 20px;
  }

  .typhoon-info {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 12px 16px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .typhoon-info strong { color: var(--accent); }

  @media (max-width: 720px) {
    .main-weather {
      grid-template-columns: 1fr;
      text-align: center;
      padding: 25px;
    }
    .weather-icon-large { width: 140px; height: 140px; margin: 0 auto; }
    .temperature { font-size: 68px; }
    .temp-row { justify-content: center; }
    .city-name { font-size: 26px; }
    .search-input { width: 180px; }
    .search-input:focus { width: 200px; }
    .day-row { grid-template-columns: 1fr auto auto; }
    .day-desc { display: none; }
    .logo span { display: none; }
  }
</style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
        </svg>
        <span>WeatherLive</span>
        <span class="ph-flag">🇵🇭 Philippines</span>
      </div>
      <div class="controls">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" class="search-input" id="searchInput" placeholder="Search PH city..." autocomplete="off">
          <div class="suggestions" id="suggestions"></div>
        </div>
        <button class="icon-btn" id="locateBtn" title="Use my location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
        <div class="unit-toggle">
          <button class="unit-btn active" data-unit="celsius">°C</button>
          <button class="unit-btn" data-unit="fahrenheit">°F</button>
        </div>
      </div>
    </header>

    <div class="quick-cities" id="quickCities"></div>

    <main id="weatherContent"></main>

    <div class="last-updated" id="lastUpdated"></div>
  </div>

  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
// ============ PHILIPPINES CITIES ============
const PH_CITIES = [
  { name: 'Manila', lat: 14.5995, lon: 120.9842, region: 'NCR' },
  { name: 'Quezon City', lat: 14.6760, lon: 121.0437, region: 'NCR' },
  { name: 'Cebu City', lat: 10.3157, lon: 123.8854, region: 'Central Visayas' },
  { name: 'Davao City', lat: 7.0707, lon: 125.6087, region: 'Davao Region' },
  { name: 'Makati', lat: 14.5547, lon: 121.0244, region: 'NCR' },
  { name: 'Taguig', lat: 14.5178, lon: 121.0506, region: 'NCR' },
  { name: 'Pasig', lat: 14.5764, lon: 121.0851, region: 'NCR' },
  { name: 'Baguio', lat: 16.4023, lon: 120.5960, region: 'CAR' },
  { name: 'Iloilo City', lat: 10.7202, lon: 122.5621, region: 'Western Visayas' },
  { name: 'Zamboanga City', lat: 6.9214, lon: 122.0790, region: 'Zamboanga Peninsula' },
  { name: 'Cagayan de Oro', lat: 8.4542, lon: 124.6319, region: 'Northern Mindanao' },

  { name: 'Bacolod', lat: 10.6840, lon: 122.9563, region: 'Western Visayas' },
  { name: 'General Santos', lat: 6.1164, lon: 125.1716, region: 'SOCCSKSARGEN' }
];

// ============ STATE ============
const state = {
  unit: 'celsius',
  currentData: null,
  currentLocation: null,
  searchTimeout: null,
  cityTemps: {}
};

// ============ DOM ============
const $ = id => document.getElementById(id);
const searchInput = $('searchInput');
const suggestions = $('suggestions');
const weatherContent = $('weatherContent');
const loading = $('loading');
const toast = $('toast');
const lastUpdated = $('lastUpdated');
const quickCities = $('quickCities');

// ============ WEATHER CODES ============
const weatherCodes = {
  0: { desc: 'Clear sky', icon: 'sun', bg: 'clear' },
  1: { desc: 'Mainly clear', icon: 'sun', bg: 'clear' },
  2: { desc: 'Partly cloudy', icon: 'cloud-sun', bg: 'cloudy' },
  3: { desc: 'Overcast', icon: 'cloud', bg: 'cloudy' },
  45: { desc: 'Foggy', icon: 'fog', bg: 'fog' },
  48: { desc: 'Rime fog', icon: 'fog', bg: 'fog' },
  51: { desc: 'Light drizzle', icon: 'drizzle', bg: 'rain' },
  53: { desc: 'Drizzle', icon: 'drizzle', bg: 'rain' },
  55: { desc: 'Heavy drizzle', icon: 'drizzle', bg: 'rain' },
  56: { desc: 'Freezing drizzle', icon: 'drizzle', bg: 'rain' },
  57: { desc: 'Freezing drizzle', icon: 'drizzle', bg: 'rain' },
  61: { desc: 'Light rain', icon: 'rain', bg: 'rain' },
  63: { desc: 'Rain', icon: 'rain', bg: 'rain' },
  65: { desc: 'Heavy rain', icon: 'rain', bg: 'rain' },
  66: { desc: 'Freezing rain', icon: 'rain', bg: 'rain' },
  67: { desc: 'Freezing rain', icon: 'rain', bg: 'rain' },
  71: { desc: 'Light snow', icon: 'snow', bg: 'snow' },
  73: { desc: 'Snow', icon: 'snow', bg: 'snow' },
  75: { desc: 'Heavy snow', icon: 'snow', bg: 'snow' },
  77: { desc: 'Snow grains', icon: 'snow', bg: 'snow' },
  80: { desc: 'Rain showers', icon: 'rain', bg: 'rain' },
  81: { desc: 'Rain showers', icon: 'rain', bg: 'rain' },
  82: { desc: 'Violent showers', icon: 'rain', bg: 'rain' },
  85: { desc: 'Snow showers', icon: 'snow', bg: 'snow' },
  86: { desc: 'Heavy snow showers', icon: 'snow', bg: 'snow' },
  95: { desc: 'Thunderstorm', icon: 'thunder', bg: 'thunder' },
  96: { desc: 'Thunderstorm with hail', icon: 'thunder', bg: 'thunder' },
  99: { desc: 'Severe thunderstorm', icon: 'thunder', bg: 'thunder' }
};

// ============ SVG ICONS ============

// ============ UTILS ============
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function showLoading(show) {
  loading.classList.toggle('show', show);
}

function convertTemp(celsius) {
  if (state.unit === 'fahrenheit') return Math.round(celsius * 9/5 + 32);
  return Math.round(celsius);
}

function tempUnit() {
  return state.unit === 'fahrenheit' ? '°F' : '°C';
}

function windUnit() {
  return state.unit === 'fahrenheit' ? 'mph' : 'km/h';
}

function convertWind(kmh) {
  if (state.unit === 'fahrenheit') return Math.round(kmh * 0.621371);
  return Math.round(kmh);
}

function formatDay(isoString, idx) {
  const d = new Date(isoString);
  if (idx === 0) return 'Today';
  if (idx === 1) return 'Tomorrow';
  return d.toLocaleDateString([], { weekday: 'short' });
}

function formatDate(d) {
  return d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

function getWindDir(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

// ============ PAGASA-STYLE ALERTS ============
function generateAlerts(data) {
  const current = data.current;
  const daily = data.daily;
  const alerts = [];
  
  // Heat index warning (PH context)
  const heatIndex = computeHeatIndex(current.temperature_2m, current.relative_humidity_2m);
  if (heatIndex >= 41) {
    alerts.push({
      type: 'warning',
      title: '⚠️ Extreme Caution',
      text: `Heat index of ${Math.round(heatIndex)}°C. Possible heat cramps and heat exhaustion.`
    });
  } else if (heatIndex >= 33) {
    alerts.push({
      type: 'info',
      title: '☀️ High Heat Index',
      text: `Heat index of ${Math.round(heatIndex)}°C. Stay hydrated and limit outdoor activity.`
    });
  }
  
  // Heavy rain warning
  if (daily.precipitation_probability_max[0] >= 70) {
    alerts.push({
      type: 'warning',
      title: '🌧️ Heavy Rain Expected',
      text: `${daily.precipitation_probability_max[0]}% chance of precipitation. Prepare for possible flooding.`
    });
  }
  
  // Thunderstorm warning
  if (current.weather_code >= 95) {
    alerts.push({
      type: 'warning',
      title: '⛈️ Thunderstorm Warning',
      text: 'Thunderstorm in the area. Seek shelter indoors and avoid open areas.'
    });
  }
  
  // UV warning
  if (daily.uv_index_max[0] >= 8) {
    alerts.push({
      type: 'info',
      title: '🌞 Very High UV',
      text: `UV index of ${Math.round(daily.uv_index_max[0])}. Apply sunscreen and wear protective clothing.`
    });
  }
  
  return alerts;
}

function computeHeatIndex(T, RH) {
  // Simplified heat index formula (in Celsius)
  const Tf = T * 9/5 + 32;
  let HI = -42.379 + 2.04901523*Tf + 10.14333127*RH 
           - 0.22475541*Tf*RH - 0.00683783*Tf*Tf 
           - 0.05481717*RH*RH + 0.00122874*Tf*Tf*RH 
           + 0.00085282*Tf*RH*RH - 0.00000199*Tf*Tf*RH*RH;
  return (HI - 32) * 5/9;
}

// ============ API CALLS ============
async function searchCity(query) {
  try {
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=8&language=en&format=json`);
    const data = await res.json();
    // Prioritize PH results
    const results = data.results || [];
    results.sort((a, b) => {
      const aPH = a.country_code === 'PH' ? 0 : 1;
      const bPH = b.country_code === 'PH' ? 0 : 1;
      return aPH - bPH;
    });
    return results;
  } catch (e) {
    console.error(e);
    return [];
  }
}

async function fetchWeather(lat, lon) {
  const params = [
    `latitude=${lat}`,
    `longitude=${lon}`,
    'current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl,cloud_cover',
    'hourly=temperature_2m,precipitation_probability,weather_code',
    'daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,uv_index_max',
    'timezone=Asia/Manila',
    'forecast_days=7'
  ].join('&');

  const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
  if (!res.ok) throw new Error('Failed to fetch weather');
  return res.json();
}

// ============ QUICK CITIES ============
async function renderQuickCities() {
  const topCities = PH_CITIES.slice(0, 8);
  quickCities.innerHTML = topCities.map(c => 
    `<div class="city-chip" data-lat="${c.lat}" data-lon="${c.lon}" data-name="${c.name}" data-region="${c.region}">
      <span>${c.name}</span>
      <span class="temp" id="chip-${c.name.replace(/\s/g, '')}">--°</span>
    </div>`
  ).join('');

  // Fetch temps for quick cities
  topCities.forEach(async (c) => {
    try {
      const data = await fetchWeather(c.lat, c.lon);
      const temp = convertTemp(data.current.temperature_2m);
      state.cityTemps[c.name] = temp;
      const chipTemp = document.getElementById('chip-' + c.name.replace(/\s/g, ''));
      if (chipTemp) chipTemp.textContent = temp + '°';
    } catch (e) {}
  });
}

quickCities.addEventListener('click', (e) => {
  const chip = e.target.closest('.city-chip');
  if (!chip) return;
  const loc = {
    name: chip.dataset.name,
    country: 'Philippines',
    admin1: chip.dataset.region
  };
  loadWeather(parseFloat(chip.dataset.lat), parseFloat(chip.dataset.lon), loc);
  searchInput.value = loc.name;
  document.querySelectorAll('.city-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
});

// ============ RENDER ============
function renderWeather(data, location) {
  const current = data.current;
  const daily = data.daily;
  const hourly = data.hourly;
  const code = current.weather_code;
  const info = weatherCodes[code] || weatherCodes[0];
  const night = !current.is_day;

  document.body.className = '';
  if (night && (info.bg === 'clear' || info.bg === 'cloudy')) {
    document.body.classList.add('weather-night');
  } else {
    document.body.classList.add('weather-' + info.bg);
  }

  const now = new Date();
  const locTime = new Date(now.toLocaleString('en-US', { timeZone: data.timezone }));

  const currentHourIdx = hourly.time.findIndex(t => new Date(t) >= now) - 1;
  const startIdx = Math.max(0, currentHourIdx);
  const next24Hours = [];
  for (let i = startIdx; i < Math.min(startIdx + 24, hourly.time.length); i++) {
    next24Hours.push({
      time: hourly.time[i],
      temp: hourly.temperature_2m[i],
      precip: hourly.precipitation_probability[i],
      code: hourly.weather_code[i]
    });
  }

  const uvLevel = (uv) => {
    if (uv <= 2) return 'Low';
    if (uv <= 5) return 'Moderate';
    if (uv <= 7) return 'High';
    if (uv <= 10) return 'Very High';
    return 'Extreme';
  };

  const alerts = generateAlerts(data);
  const heatIndex = computeHeatIndex(current.temperature_2m, current.relative_humidity_2m);

  const alertsHTML = alerts.map(a => `
    <div class="alert-banner ${a.type}">
      <svg class="alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <div class="alert-content">
        <div class="alert-title">${a.title}</div>
        <div class="alert-text">${a.text}</div>
      </div>
    </div>
  `).join('');

  weatherContent.innerHTML = `
    ${alertsHTML}

    <div class="main-weather">
      <div>
        <div class="location-info">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          🇵🇭 ${location.admin1 || location.region || ''} ${location.country ? '• ' + location.country : ''}
        </div>
        <h1 class="city-name">${location.name}</h1>
        <div class="date-time">
          <span class="live-dot"></span>
          ${locTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} PHT • ${formatDate(locTime)}
        </div>
        <div class="temp-row">
          <div class="temperature">${convertTemp(current.temperature_2m)}<span class="temp-unit">${tempUnit()}</span></div>
        </div>
        <div class="weather-desc">${info.desc}</div>
        <div class="feels-like">Feels like ${convertTemp(current.apparent_temperature)}${tempUnit()} • Heat index ${Math.round(heatIndex)}°C</div>
      </div>
      <div class="weather-icon-large">${getWeatherIcon(info.icon, 200)}</div>
    </div>

    <div class="details-grid">
      <div class="detail-card">
        <div class="detail-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
          </svg>
          Humidity
        </div>
        <div class="detail-value">${current.relative_humidity_2m}%</div>
        <div class="detail-sub">${current.relative_humidity_2m > 80 ? 'Very humid (typical PH)' : current.relative_humidity_2m > 60 ? 'Humid' : 'Comfortable'}</div>
      </div>
      <div class="detail-card">
        <div class="detail-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.7 7.7a7.5 7.5 0 1 0-10.4 10.4"/>
            <path d="M7 4v4M4 7h4"/>
          </svg>
          Wind
        </div>
        <div class="detail-value">${convertWind(current.wind_speed_10m)} <span style="font-size:14px;font-weight:400;">${windUnit()}</span></div>
        <div class="detail-sub">${getWindDir(current.wind_direction_10m)} • ${describeWind(current.wind_speed_10m)}</div>
      </div>
      <div class="detail-card">
        <div class="detail-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
          Pressure
        </div>
        <div class="detail-value">${Math.round(current.pressure_msl)} <span style="font-size:14px;font-weight:400;">hPa</span></div>
        <div class="detail-sub">${current.pressure_msl > 1013 ? 'High pressure' : 'Low pressure'}</div>
      </div>
      <div class="detail-card">
        <div class="detail-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2"/>
          </svg>

        </div>
        <div class="detail-value">${Math.round(daily.uv_index_max[0])}</div>

      </div>
      <div class="detail-card">
        <div class="detail-label">

          </svg>

        </div>
        <div class="detail-value">${current.cloud_cover}%</div>
        <div class="detail-sub">${current.cloud_cover > 70 ? 'Mostly cloudy' : current.cloud_cover > 30 ? 'Partly cloudy' : 'Clear skies'}</div>
      </div>
      <div class="detail-card">
        <div class="detail-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        <div class="detail-value">${current.precipitation} <span style="font-size:14px;font-weight:400;">mm</span></div>
        <div class="detail-sub">Today's max: ${daily.precipitation_probability_max[0]}%</div>
      </div>
    </div>

    <div class="forecast-section">
      <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>

        </svg>
        7-Day Forecast
      </div>
      <div class="daily-list">
        ${daily.time.map((day, i) => {
          const dInfo = weatherCodes[daily.weather_code[i]] || weatherCodes[0];

              <div class="day-name">${formatDay(day, i)}<small>${new Date(day).toLocaleDateString([], { month: 'short', day: 'numeric' })}</small></div>

              <div class="day-desc">${dInfo.desc}</div>
              <div class="day-temps">
                <span class="temp-max">${convertTemp(daily.temperature_2m_max[i])}°</span>
                <span class="temp-min">${convertTemp(daily.temperature_2m_min[i])}°</span>
              </div>
            </div>
          `;
        }).join('')}
      </div>
      <div class="typhoon-info">

        Data source: Open-Meteo (live) • Timezone: Asia/Manila (PHT, UTC+8)<br>

      </div>
    </div>
  `;

  lastUpdated.innerHTML = `<span class="live-dot"></span>Live data • Last updated ${locTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })} PHT`;
}

function describeWind(speed) {
  if (speed < 12) return 'Light breeze';
  if (speed < 30) return 'Moderate';
  if (speed < 50) return 'Strong';
  if (speed < 75) return 'Very strong';
  return 'Stormy';
}

// ============ LOAD WEATHER ============
async function loadWeather(lat, lon, location) {
  showLoading(true);
  try {
    const data = await fetchWeather(lat, lon);
    state.currentData = data;
    state.currentLocation = location;
    renderWeather(data, location);
  } catch (e) {
    console.error(e);
    showToast('Failed to load weather data');
  } finally {
    showLoading(false);
  }
}

// ============ SEARCH ============
searchInput.addEventListener('input', (e) => {
  const q = e.target.value.trim();
  clearTimeout(state.searchTimeout);
  if (q.length < 2) {
    suggestions.classList.remove('show');
    return;
  }
  state.searchTimeout = setTimeout(async () => {
    const results = await searchCity(q);
    if (results.length === 0) {
      suggestions.innerHTML = '<div class="suggestion-item">No results found</div>';
    } else {
      suggestions.innerHTML = results.map(r => `
        <div class="suggestion-item" data-lat="${r.latitude}" data-lon="${r.longitude}" data-name="${r.name}" data-country="${r.country || ''}" data-admin="${r.admin1 || ''}" data-cc="${r.country_code || ''}">
          <span class="suggestion-city">${r.name}</span>
          <span class="suggestion-country">${r.admin1 ? r.admin1 + ', ' : ''}${r.country || ''} ${r.country_code === 'PH' ? '🇵🇭' : ''}</span>
        </div>
      `).join('');
    }
    suggestions.classList.add('show');
  }, 350);
});

suggestions.addEventListener('click', (e) => {
  const item = e.target.closest('.suggestion-item');
  if (!item || !item.dataset.lat) return;
  const isPH = item.dataset.cc === 'PH';
  const loc = {
    name: item.dataset.name,
    country: item.dataset.country,
    admin1: item.dataset.admin,
    region: isPH ? item.dataset.admin : ''
  };
  loadWeather(parseFloat(item.dataset.lat), parseFloat(item.dataset.lon), loc);
  searchInput.value = loc.name;
  suggestions.classList.remove('show');
  document.querySelectorAll('.city-chip').forEach(c => c.classList.remove('active'));
});

searchInput.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    const q = searchInput.value.trim();
    if (q.length < 2) return;
    const results = await searchCity(q);
    if (results.length > 0) {
      const r = results[0];
      const isPH = r.country_code === 'PH';
      loadWeather(r.latitude, r.longitude, {
        name: r.name,
        country: r.country || '',
        admin1: r.admin1 || '',
        region: isPH ? r.admin1 : ''
      });
      suggestions.classList.remove('show');
    } else {
      showToast('City not found');
    }
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-box')) {
    suggestions.classList.remove('show');
  }
});

// ============ GEOLOCATION ============
$('locateBtn').addEventListener('click', () => {
  if (!navigator.geolocation) {
    showToast('Geolocation not supported');
    return;
  }
  showLoading(true);
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude } = pos.coords;
      try {
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`);
        const geoData = await geoRes.json();
        const isPH = geoData.address.country_code === 'ph';
        const loc = {
          name: geoData.address.city || geoData.address.town || geoData.address.village || 'Your Location',
          country: geoData.address.country || '',
          admin1: geoData.address.state || '',
          region: isPH ? (geoData.address.state || '') : ''
        };
        searchInput.value = loc.name;
        loadWeather(latitude, longitude, loc);
      } catch (e) {
        loadWeather(latitude, longitude, { name: 'Your Location', country: '', admin1: '' });
      }
    },
    (err) => {
      showLoading(false);
      showToast('Location access denied');
    },
    { timeout: 10000 }
  );
});

// ============ UNIT TOGGLE ============
document.querySelectorAll('.unit-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.unit = btn.dataset.unit;
    if (state.currentData && state.currentLocation) {
      renderWeather(state.currentData, state.currentLocation);
    }
    // Refresh chip temps
    document.querySelectorAll('.city-chip').forEach(chip => {
      const name = chip.dataset.name;
      if (state.cityTemps[name]) {
        const chipTemp = chip.querySelector('.temp');
        if (chipTemp) chipTemp.textContent = state.cityTemps[name] + '°';
      }
    });
  });
});

// ============ AUTO-REFRESH ============
setInterval(() => {
  if (state.currentData && state.currentLocation) {
    const loc = state.currentLocation;
    const lat = state.currentData.latitude;
    const lon = state.currentData.longitude;
    fetchWeather(lat, lon).then(data => {
      state.currentData = data;
      renderWeather(data, loc);
    }).catch(() => {});
  }
}, 10 * 60 * 1000);

// ============ INITIAL LOAD - MANILA ============
(async () => {
  renderQuickCities();
  const manila = PH_CITIES[0];
  searchInput.value = manila.name;
  await loadWeather(manila.lat, manila.lon, {
    name: manila.name,
    country: 'Philippines',
    admin1: manila.region,
    region: manila.region
  });
  // Mark Manila chip as active
  const firstChip = document.querySelector('.city-chip');
  if (firstChip) firstChip.classList.add('active');
})();
</script>
